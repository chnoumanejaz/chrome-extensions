<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BugDetector</title>
  <link rel="stylesheet" href="../ui/theme.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main class="popup">
    <header class="header">
      <div class="brand"><img src="../icons/icon48.png" alt=""> BugDetector</div>
      <button class="btn btn-ghost btn-icon" id="open-options" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <section class="page" aria-label="Current page">
      <div class="host" id="page-host">—</div>
      <div class="stats" id="page-stats"></div>
      <p class="notice small" id="page-notice" hidden></p>
    </section>

    <section class="capture">
      <button class="btn btn-primary btn-lg btn-block" id="capture" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l1.9 1.9M16 2l-1.9 1.9M9 7.1V6a3 3 0 0 1 6 0v1.1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6zM12 20v-9"/><path d="M6.5 13H3M21 13h-3.5M6 9.5L3.5 8M18 9.5L20.5 8M6.5 17L4 19M17.5 17L20 19"/></svg>
        <span id="capture-label">Capture bug</span>
      </button>
      <button class="btn btn-block" id="pick" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4l7 17 2.5-7.5L21 11z"/><path d="M14 14l6 6"/></svg>
        Select broken element
      </button>
      <div class="shortcut small muted">
        <span>Capture <kbd id="shortcut">…</kbd></span>
        <span>Select <kbd id="pick-shortcut">…</kbd></span>
        <button class="linklike" id="change-shortcut" type="button">Change</button>
      </div>
      <p class="error small" id="capture-error" role="alert" hidden></p>
    </section>

    <section class="settings" aria-label="Detection settings">
      <div class="row">
        <div>
          <label for="auto-detect">Auto-detect bugs</label>
          <div class="small muted">Show a popup when something breaks</div>
        </div>
        <label class="switch"><input type="checkbox" id="auto-detect"><span></span></label>
      </div>
      <div class="row">
        <label for="sensitivity">Alert me on</label>
        <select id="sensitivity" class="compact">
          <option value="errors">Errors only</option>
          <option value="errors+network">Errors + failed requests</option>
          <option value="all">Errors, requests + warnings</option>
        </select>
      </div>
      <div class="row" id="site-row">
        <div>
          <label for="site-enabled">Active on this site</label>
          <div class="small muted" id="site-hint"></div>
        </div>
        <label class="switch"><input type="checkbox" id="site-enabled"><span></span></label>
      </div>
    </section>

    <section class="recent" aria-labelledby="recent-title">
      <h2 id="recent-title" class="small muted">Recent reports</h2>
      <ul id="recent-list"></ul>
    </section>
  </main>
</body>
</html>
